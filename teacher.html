<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無規則教室｜教師後台</title><link rel="stylesheet" href="css/rpg.css"><link rel="stylesheet" href="css/teacher.css"></head><body><header><a href="index.html">✦ 無規則教室｜教師後台</a><a href="projection.html">開啟投影頁</a></header><main class="teacher-wrap"><section id="login" class="paper login"><h1>教師驗證</h1><p>請輸入 Apps Script 設定的教師 Token。</p><input id="token" type="password" placeholder="Teacher Token"><button id="loginBtn" class="primary">進入後台</button></section><section id="dashboard" hidden><div class="toolbar"><label>班級<select id="classSelect"></select></label><button id="refresh" class="primary">更新資料</button></div><div id="metrics" class="metrics"></div><section class="paper wide"><h2>學生闖關進度</h2><div id="progress"></div><p><b>尚未登入座號：</b><span id="missing"></span></p></section><section class="paper wide"><h2>匿名統計</h2><div id="stats"></div></section><section class="paper wide"><h2>匿名留言（僅教師可見）</h2><div id="comments"></div></section><section class="paper wide"><h2>正式班規</h2><label>📱 手機<textarea id="phone"></textarea></label><label>😴 午休<textarea id="lunch"></textarea></label><label>🗑️ 公共環境<textarea id="environment"></textarea></label><label>📚 上課準備<textarea id="ready"></textarea></label><label>其他班級規範<textarea id="other"></textarea></label><button id="saveRules" class="primary">儲存班規草案</button><button id="publish" class="primary">公布正式班規</button></section><section class="paper wide danger"><h2>測試資料管理</h2><p>清空後無法復原，且會刪除這個班級全部學生資料。</p><button id="reset" class="primary">重設指定班級資料</button></section></section></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/game-data.js"></script><script src="js/teacher.js"></script></body></html>
